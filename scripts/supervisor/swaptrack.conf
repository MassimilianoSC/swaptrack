[program:swaptrack-emulators]
command=/app/scripts/emulators.sh
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stderr_logfile=/var/log/supervisor/emulators.err.log
stdout_logfile=/var/log/supervisor/emulators.out.log

[program:swaptrack-web]
command=/app/scripts/dev-preview.sh
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/supervisor/web.err.log
stdout_logfile=/var/log/supervisor/web.out.log
